<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poker v2 — Asset Gallery</title>
  <style>
    :root { color-scheme: dark; font-family: Segoe UI, Arial, sans-serif; }
    body { margin: 0; padding: 30px; color: #f6e9cf; background: #1b110d; }
    header { max-width: 1200px; margin: auto; }
    h1 { font-family: Georgia, serif; color: #f4d28b; margin: 0 0 8px; }
    p { color: #cab99b; line-height: 1.5; }
    main { max-width: 1200px; margin: 25px auto; }
    section { margin: 30px 0 45px; }
    h2 { color: #e9c27f; border-bottom: 1px solid #76532e; padding-bottom: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    .card { background: #352217; border: 1px solid #967248; border-radius: 10px; padding: 12px; }
    .preview { height: 145px; display: flex; align-items: center; justify-content: center; background: #211d1b; border-radius: 7px; overflow: hidden; }
    .preview img { max-width: 100%; max-height: 135px; object-fit: contain; }
    .name { display: block; margin-top: 10px; color: #f6e9cf; font-size: 13px; overflow-wrap: anywhere; }
    .card a { text-decoration: none; }
    .card a:hover .name { color: #ffd17b; text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>Poker — Bộ asset cổ điển v2</h1>
    <p>Nhấn vào ảnh để mở PNG gốc. Chip và avatar là bộ đã tạo trước đó; khung, nút và icon là các file tách riêng. Thư mục <code>screens/</code> chỉ chứa ảnh tham khảo từ ZIP.</p>
  </header>
  <main id="gallery"></main>
  <script>
    const groups = {
      'Khung giao diện': ['room-card','player-seat','chat-panel','modal-dark','modal-cream','settings-panel','result-panel','search-field','chat-input','room-list','title-banner'].map(n => `pack/frames/${n}.png`),
      'Nền nút': ['red','blue','green','orange','gold','disabled'].map(n => `pack/buttons/${n}.png`),
      'Icon': ['spade','heart','club','diamond','crown','lock','eye','wifi-off','timer','check','close','send','users','chat','search','online'].map(n => `pack/icons/${n}.png`),
      'Marker': ['dealer','small-blind','big-blind'].map(n => `pack/markers/${n}.png`),
      'Chip': [1,5,25,100,500,1000].map(n => `chips/chip-${n}.png`),
      'Avatar': [1,2,3,4,5,6].map(n => `avatars/avatar_player_${n}.png`),
      'Nền, bàn, trang trí': ['backgrounds/casino.png','table/poker-table-v2.png','table/poker-table.png','pack/decor/chip-stack.png']
    };
    const main = document.getElementById('gallery');
    for (const [title, paths] of Object.entries(groups)) {
      const section = document.createElement('section');
      const heading = document.createElement('h2');
      heading.textContent = `${title} (${paths.length})`;
      const grid = document.createElement('div');
      grid.className = 'grid';
      for (const path of paths) {
        const card = document.createElement('div');
        card.className = 'card';
        const link = document.createElement('a');
        link.href = path;
        const preview = document.createElement('div');
        preview.className = 'preview';
        const img = document.createElement('img');
        img.src = path;
        img.alt = path;
        preview.append(img);
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = path;
        link.append(preview, name);
        card.append(link);
        grid.append(card);
      }
      section.append(heading, grid);
      main.append(section);
    }
  </script>
</body>
</html>
